
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Praktik Perulangan</title>
</head>
<body>
    <script>
        var jumlah = prompt("Mau mengulang berapa kali?");

        for (var i = 1; i <= jumlah; i++) {
            console.log("Perulangan ke-" + i);
            document.write("Perulangan ke-" + i + "<br>");
        }
    </script>
</body>
</html>
