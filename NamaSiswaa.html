<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Siswa</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    table, th, td {
      border: 1px solid rgb(241, 96, 5);
      border-collapse: collapse;
      padding: 6px;
    }
    table {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>
<body>
  <table id="siswa-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nama</th>
        <th>Panggilan</th>
        <th>Kelas</th>
        <th>Jenis Kelamin</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
  $(document).ready(function() {
    $.getJSON('https://api.rplcoders.com/siswa.php', function(data) {
      $('#siswa-table tbody').html(
        $.map(data.siswa, function(siswa) {
          return `
            <tr>
              <td>${siswa.id}</td>
              <td>${siswa.nama}</td>
              <td>${siswa.panggilan}</td>
              <td>${siswa.kelas}</td>
              <td>${siswa.jk}</td>
            </tr>
          `;
        }).join('')
      );
    });
  });
  </script>
</body>
</html>
