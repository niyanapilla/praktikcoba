        }
    </style>
</head>
<body>
    <table id="Nama-Siswa">

                <td>jk</td>
            </tr>
        </thead>
    </table>

<script>
    $.getJSON('https://api.rplcoders.com/siswa.php', function(data)) {
        $('NamaSiswa tbody').html(
            $.map(data.NamaSiswa, nama =>
                <tr>
                        <td>${siswa.id}</td>
                        <td>${siswa.nama}</td>
                        <td>${siswa.panggilan}</td>
                        <td>${siswa.kelas}</td>
                        <td>${siswa.jk}</td>

</script>
