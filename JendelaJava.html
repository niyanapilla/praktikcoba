<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jendela Java</title>
</head>
<body>
    <script>
        var a = 20;
        var b = 5;
        console.log("Angka pertama: " + a);
        console.log("Angka kedua: " + b);
        console.log("Penjumlahan: " + (a + b));
        console.log("Pengurangan: " + (a - b));
        console.log("Perkalian: " + (a * b));
        console.log("Pembagian: " + (a / b));

        document.write("Angka pertama: " + a + "<br>");
        document.write("Angka kedua: " + b + "<br>");
        document.write("Penjumlahan: " + (a + b) + "<br>");
        document.write("Pengurangan: " + (a - b) + "<br>");
        document.write("Perkalian: " + (a * b) + "<br>");
        document.write("Pembagian: " + (a / b) + "<br>");
    </script>
</body>
</html>
